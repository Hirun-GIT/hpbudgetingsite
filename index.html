<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Defensive shim: Ensure window.fetch has both getter and setter so injected browser extensions
      // attempting to proxy or monitor fetch do not fail with "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _f;
            },
            set: function(val) {
              _f = val;
            }
          });
        } catch (e) {
          try {
            if (window.Window && window.Window.prototype) {
              var _pf = window.Window.prototype.fetch;
              Object.defineProperty(window.Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return _pf;
                },
                set: function(val) {
                  _pf = val;
                }
              });
            }
          } catch (err) {}
        }
      })();
    </script>
